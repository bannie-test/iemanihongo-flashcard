name: Deploy flashcard website to GitHub Pages

# Mỗi lần đẩy lên develop (hoặc main), kiểm tra code rồi đưa trang web lên GitHub Pages.
# Cần bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions,
# và cho phép nhánh develop ở Settings → Environments → github-pages → Deployment branches.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's scripts parse
        run: for f in *.js data/*.js; do node --check "$f"; done

      # Chỉ đưa các file của trang web lên, không kèm tool/, README, .github/.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js scene.js painter.js data assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
